plugins {
    alias libs.plugins.agp.app
}

android {
    namespace = "com.afwsamples.testdpc"
    compileSdk = 37

    defaultConfig {
        minSdk = 23
        targetSdk = compileSdk
        versionCode = 9016
        versionName = "9.0.16"
        proguardFiles += "proguard-rules.pro"
    }

    signingConfigs {
        android {
            storeFile file("android.jks")
            storePassword "android"
            keyAlias "android"
            keyPassword "android"
        }
    }

    buildTypes {
        configureEach {
            signingConfig = signingConfigs.android
            minifyEnabled = false
        }
        release {
            minifyEnabled = true
            shrinkResources = true
        }
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += 'META-INF/**'
        }
    }

    lint {
        abortOnError = false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

tasks.withType(Test).configureEach {
    jvmArgs "--add-opens=java.base/jdk.internal.access=ALL-UNNAMED"
    maxHeapSize = "2048m"
}

dependencies {
    coreLibraryDesugaring libs.desugar

    implementation libs.annotation
    implementation libs.appcompat
    implementation libs.appcompat.resources
    implementation libs.collection
    implementation libs.constraintlayout
    implementation libs.androidx.core
    implementation libs.enterprise
    implementation libs.legacy
    implementation libs.legacy.v13
    implementation libs.lifecycle.common
    implementation libs.lifecycle.process
    implementation libs.lifecycle.runtime
    implementation libs.localbroadcastmanager
    implementation libs.preference
    implementation libs.recyclerview
    implementation libs.window
    implementation libs.errorprone
    implementation libs.guava
    implementation libs.material
    implementation libs.inject
    implementation libs.bcpkix
    implementation libs.bcprov

    testImplementation libs.test.core
    testImplementation libs.test.monitor
    testImplementation libs.test.runner
    testImplementation libs.testparameterinjector
    testImplementation libs.truth
    //testImplementation libs.hamcrest
    testImplementation libs.robolectric
    //testImplementation libs.robolectric.annotations
    //testImplementation libs.robolectric.shadows
    testImplementation libs.junit

    implementation project(":setupcompat")
    implementation project(":setupdesign")
}
