[versions]
agp = "9.4.1"

# AndroidX
annotation = "1.11.0"
appcompat = "1.6.1"
collection = "1.7.0"
constraintlayout = "2.2.2"
androidx-core = "1.12.0"
enterprise = "1.1.0"
legacy = "1.0.0"
lifecycle = "2.9.4"
localbroadcastmanager = "1.1.0"
preference = "1.2.1"
recyclerview = "1.3.2"
test-core = "1.7.0"
test-monitor = "1.8.0"
test-runner = "1.7.0"
window = "1.4.0"

# Google
errorprone = "2.50.0"
guava = "33.7.2-android"
material = "1.11.0"
testparameterinjector = "1.24"
truth = "1.4.5"

# Java Extension
inject = "1"

# airbnb
lottie = "6.4.0"

# Bouncy Castle Crypto Package
bccp = "1.86"

# Hamcrest
hamcrest = "2.0.0.0"

# Robolectric
robolectric = "4.17"
robolectric-annotations = "3.3.2"
robolectric-shadows = "3.3.2"

# JUnit 
junit = "4.13.2"

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
agp-lib = { id = "com.android.library", version.ref = "agp" }

[libraries]
# AndroidX
annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
appcompat-resources = { group = "androidx.appcompat", name = "appcompat-resources", version.ref = "appcompat" }
collection = { group = "androidx.collection", name = "collection", version.ref = "collection" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidx.core" }
enterprise = { group = "androidx.enterprise", name = "enterprise-feedback", version.ref = "enterprise" }
legacy = { group = "androidx.legacy", name = "legacy-support-core-ui", version.ref = "legacy" }
legacy-v13 = { group = "androidx.legacy", name = "legacy-support-v13", version.ref = "legacy" }
lifecycle-common = { group = "androidx.lifecycle", name = "lifecycle-common", version.ref = "lifecycle" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }
localbroadcastmanager = { group = "androidx.localbroadcastmanager", name = "localbroadcastmanager", version.ref = "localbroadcastmanager" }
preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
test-core = { group = "androidx.test", name = "core", version.ref = "test.core" }
test-monitor = { group = "androidx.test", name = "monitor", version.ref = "test.monitor" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "test.runner" }
window = { group = "androidx.window", name = "window", version.ref = "window" }

# Google
errorprone = { group = "com.google.errorprone", name = "error_prone_annotations", version.ref = "errorprone" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
testparameterinjector = { group = "com.google.testparameterinjector", name = "test-parameter-injector", version.ref = "testparameterinjector" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

# Java Extension
inject = { group = "javax.inject", name = "javax.inject", version.ref = "inject" }

# airbnb
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }

# Bouncy Castle Crypto Package
bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bccp" }
bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bccp" }

# Hamcrest
hamcrest = { group = "org.hamcrest", name = "hamcrest", version.ref = "hamcrest" }

# Robolectric
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
robolectric-annotations = { group = "org.robolectric", name = "robolectric-annotations", version.ref = "robolectric.annotations" }
robolectric-shadows = { group = "org.robolectric", name = "robolectric-shadows", version.ref = "robolectric.shadows" }

# JUnit
junit = { group = "junit", name = "junit", version.ref = "junit" }
